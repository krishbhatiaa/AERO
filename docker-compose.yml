# Production stack. Copy .env.example to .env first.
#   docker compose up --build                 # backend + frontend + PostGIS + Redis + MinIO
#   docker compose up backend frontend        # only app services (requires external DB/Redis)
# The Celery `worker` and `ml-service` containers are NOT included yet.
# GPU support is added later via a compose override, never required.
services:
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: [.env]
    environment:
      DATA_PATH: /srv/var/data
      AUDIT_LOG_PATH: /srv/var/audit.log
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ewai_var:/srv/var
      - ./var/data:/srv/var/data
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    depends_on: [backend]
    ports: ["127.0.0.1:8081:8080"]
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports: ["127.0.0.1:5434:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # cache only; not a system of record
    ports: ["127.0.0.1:6380:6379"]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["miniodata:/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    restart: unless-stopped

volumes:
  ewai_var:
  pgdata:
  miniodata:
